# NOTE:
# This is the A4 baseline configuration used to validate loader priority
# (defaults + settings.yaml + env overrides). It is intentionally minimal.
# Full config-driven schema from DEV_SPEC section 5.6 is planned in D10.
app_name: rag-mcp-server
environment: development

# Local model cache directory (relative to rag-server/ working directory).
# sentence-transformers and CrossEncoder load from here when
# SENTENCE_TRANSFORMERS_HOME points to this path at startup.
# This directory is git-ignored; copy/rsync it when migrating to a new host.
model_cache_dir: ./models

llm:
  provider: qwen
  model: qwen-plus
  api_key: replace-me
  timeout_seconds: 30
retrieval:
  top_k: 5

# D6: PostgreSQL connection defaults (override with PG_HOST/PG_DATABASE/etc. env vars)
postgres:
  host: localhost
  port: 5432
  database: rag_db
  user: postgres
  password: ""
  schema: public
  sslmode: disable
  pool_size: 5
  pool_timeout_sec: 30
  statement_timeout_ms: 30000

# D6: VectorStore configuration
# embedding_dim must match the local model output:
#   bge-large-zh-v1.5 / bge-m3 -> 1024
#   OpenAI text-embedding-3-small  -> 1536  (switch back when using OpenAI)
vector_store:
  backend: pgvector
  table: rag_chunks
  embedding_dim: 1024 # bge-large-zh-v1.5 / bge-m3
  distance_metric: cosine
  enable_sparse_fields: true
  metadata_jsonb: true

# D7: Reranker configuration
rerank:
  backend: cross_encoder # none | cross_encoder | llm
  model: BAAI/bge-reranker-v2-m3
  max_candidates: 30
  timeout_sec: 10.0
  fallback_to_none: true
