# NOTE:
# This is the A4 baseline configuration used to validate loader priority
# (defaults + settings.yaml + env overrides). It is intentionally minimal.
# Full config-driven schema from DEV_SPEC section 5.6 is planned in D10.
app_name: rag-mcp-server
environment: development
llm:
  provider: qwen
  model: qwen-plus
  api_key: replace-me
  timeout_seconds: 30
retrieval:
  top_k: 5

# D6: PostgreSQL connection defaults (override with PG_HOST/PG_DATABASE/etc. env vars)
postgres:
  host: localhost
  port: 5432
  database: rag_db
  user: postgres
  password: ""
  schema: public
  sslmode: disable
  pool_size: 5
  pool_timeout_sec: 30
  statement_timeout_ms: 30000

# D6: VectorStore configuration
vector_store:
  backend: pgvector
  table: rag_chunks
  embedding_dim: 1536
  distance_metric: cosine
  enable_sparse_fields: true
  metadata_jsonb: true
