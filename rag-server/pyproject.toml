[project]
name = "rag-mcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"ollama>=0.3.0,<1.0.0",
	"openai>=1.0.0,<2.0.0",
	"pydantic>=2.11.0,<3.0.0",
	"pyyaml>=6.0.2,<7.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
	"httpx>=0.28.0,<1.0.0",
	"pytest>=8.4.0,<9.0.0",
	"pytest-asyncio>=0.26.0,<1.0.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
