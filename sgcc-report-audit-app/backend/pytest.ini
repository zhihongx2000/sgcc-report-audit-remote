[pytest]
# ==========================
# 1. 测试发现与收集规则
# ==========================

# 指定 pytest 默认搜索测试用例的目录列表。
# 明确指定目录能显著提高测试收集的效率，并防止 pytest 扫描到不需要的文件夹（如 node_modules 或 venv）。
testpaths =
    tests/unit
    tests/integration
    tests/e2e

# 自定义测试文件的命名匹配规则。
# 只有以 "test_" 开头且以 ".py" 结尾的文件，才会被 pytest 识别为包含测试用例的文件。
python_files = test_*.py

# ==========================
# 2. 执行与插件配置
# ==========================

# 配置默认的命令行参数（相当于每次运行 pytest 都自动挂载这些参数）。
# -ra: 在测试结束后，输出一个简短的测试总结报告，包含除“通过(passed)”以外的所有状态（如 skipped, xfail, errors 等）。
# --strict-markers: 开启严格标记模式。一旦代码中使用了未在下方 `markers` 列表中注册的装饰器，直接报错，防止拼写错误。
addopts = -ra --strict-markers

# 针对 `pytest-asyncio` 插件的配置。
# auto 模式：自动将所有的异步函数 (async def) 识别为异步测试用例去执行，无需在每个函数上额外加 @pytest.mark.asyncio 注解。
asyncio_mode = auto

# ==========================
# 3. 自定义标记注册 (Markers)
# ==========================

# 集中注册项目中所有使用的自定义标记，配合 --strict-markers 使用。
# 语法为：标记名称: 该标记的用途说明。
markers =
    unit: Unit tests for isolated modules. (单元测试：用于测试独立的方法或类)
    integration: Integration tests for cross-module behavior. (集成测试：用于测试多个模块间的交互和集成)
    e2e: End-to-end tests for workflow validation. (端到端测试：用于模拟用户真实操作的完整业务链路测试)

# ==========================
# 4. 实时日志配置 (Live Logging)
# ==========================

# 允许在控制台中实时打印代码里 logging 模块输出的日志。
log_cli = true

# 设置控制台打印日志的最低级别。INFO 级别意味着 DEBUG 日志将被隐藏，而 INFO, WARNING, ERROR, CRITICAL 会被打印。
log_cli_level = INFO

# 自定义每条日志的输出格式。
# 效果示例：2026-03-16 10:05:00 [INFO] 用户登录成功 (test_auth.py:42)
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)

# 自定义上方 `%(asctime)s` 占位符的时间显示格式。
log_cli_date_format = %Y-%m-%d %H:%M:%S